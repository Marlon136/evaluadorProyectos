services:
  - type: web
    name: evaluador-negocios-digitales
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # Clave de Google Gemini (gratis). Se define en el panel de Render,
      # NO se sube al repositorio (sync: false = se pide manualmente).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: PYTHON_VERSION
        value: "3.12.4"
